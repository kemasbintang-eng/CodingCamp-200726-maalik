<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Tombol Dark/Light Mode — sudut kanan atas -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">
      <span id="theme-icon">🌙</span>
    </button>

    <div class="container">

      <!-- Header / Balance -->
      <header class="header">
        <h1>Expense & Budget Visualizer</h1>
        <div class="balance-card">
          <p class="balance-label">Total Pengeluaran</p>
          <p class="balance-amount" id="total-balance">Rp 0</p>
        </div>
      </header>

      <main class="main-content">

        <!-- Form Input -->
        <section class="card form-section">
          <h2>Tambah Transaksi</h2>
          <form id="expense-form" novalidate>

            <div class="form-group">
              <label for="item-name">Nama Barang</label>
              <input
                type="text"
                id="item-name"
                placeholder="Contoh: Makan siang"
                autocomplete="off"
              />
              <span class="error-msg" id="error-name"></span>
            </div>

            <div class="form-group">
              <label for="item-amount">Jumlah (Rp)</label>
              <input
                type="number"
                id="item-amount"
                placeholder="Contoh: 25000"
                min="1"
              />
              <span class="error-msg" id="error-amount"></span>
            </div>

            <div class="form-group">
              <label for="item-category">Kategori</label>
              <select id="item-category">
                <option value="">-- Pilih Kategori --</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
              <span class="error-msg" id="error-category"></span>
            </div>

            <button type="submit" class="btn-add">Tambah</button>

          </form>
        </section>

        <div class="bottom-grid">

          <!-- Transaction List -->
          <section class="card list-section">
            <div class="list-header">
              <h2>Daftar Transaksi</h2>
              <select id="sort-select" aria-label="Urutkan transaksi">
                <option value="newest">Terbaru</option>
                <option value="highest">Nominal Tertinggi</option>
                <option value="lowest">Nominal Terendah</option>
              </select>
            </div>
            <div class="transaction-list" id="transaction-list">
              <p class="empty-state" id="empty-state">Belum ada transaksi.</p>
            </div>
          </section>

          <!-- Chart -->
          <section class="card chart-section">
            <h2>Pengeluaran per Kategori</h2>
            <div class="chart-wrapper">
              <canvas id="expense-chart"></canvas>
            </div>
            <p class="empty-state" id="chart-empty-state">Tambah transaksi untuk melihat chart.</p>
          </section>

        </div>

      </main>

    </div>

    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- App Script -->
    <script src="js/app.js"></script>

  </body>
</html>
